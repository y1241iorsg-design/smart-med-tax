[project]
name = "smart-med-tax-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-playwright>=0.7.0",
    "playwright>=1.40.0",
    "google-genai>=1.47.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
